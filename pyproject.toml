[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mc-save-doctor"
version = "0.1.0"
description = "Minecraft 存档体检：找回你家在哪、上次死在哪，顺手修坏掉的 level.dat 和 region"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gao Haoran" }]
keywords = ["minecraft", "nbt", "region", "save", "recovery", "forensics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Games/Entertainment",
]
dependencies = []

[project.scripts]
mcsavedoctor = "mcsavedoctor.cli:main"

[project.urls]
Homepage = "https://github.com/208347872-rgb/mc-save-doctor"
Issues = "https://github.com/208347872-rgb/mc-save-doctor/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
